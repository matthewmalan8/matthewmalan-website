name: Sync Beeminder

on:
  workflow_dispatch:
  schedule:
    # 06:45 UTC daily = 23:45 MST (Phoenix) the previous day.
    # That's 14 minutes before the 23:59 MST enforcement moment, giving
    # Beeminder plenty of time to register the final datapoint before
    # it evaluates and (potentially) charges.
    - cron: "45 6 * * *"

concurrency:
  group: sync-beeminder
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # Re-fetch Hevy + Google Tasks so the goal counters reflect today's
      # data before we push to Beeminder.
      - name: Fetch Hevy
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
        run: node scripts/fetch-hevy.mjs

      - name: Sync Beeminder
        env:
          BEEMINDER_USERNAME: ${{ secrets.BEEMINDER_USERNAME }}
          BEEMINDER_AUTH_TOKEN: ${{ secrets.BEEMINDER_AUTH_TOKEN }}
          BEEMINDER_DRY_RUN: ${{ vars.BEEMINDER_DRY_RUN }}
        run: node scripts/sync-beeminder.mjs
