name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 06:45 UTC = 23:45 MST the previous day. The deploy:aws script does
    # `prebuild → build → sync-beeminder.mjs → S3 sync`, so this fires
    # right before Beeminder's 23:59 MST evaluation window — pulling
    # FocusMate's session data from Beeminder, rebuilding /goals/ with
    # fresh numbers, and pushing the website's view back to Beeminder.
    - cron: "45 6 * * *"
    # 07:00 UTC = midnight Mesa, Arizona — kept so scheduled episodes
    # auto-flip to playable the moment their release date starts in MST.
    - cron: "0 7 * * *"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build + deploy to S3 + invalidate CloudFront
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_TASKS_REFRESH_TOKEN: ${{ secrets.GOOGLE_TASKS_REFRESH_TOKEN }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BEEMINDER_USERNAME: ${{ secrets.BEEMINDER_USERNAME }}
          BEEMINDER_AUTH_TOKEN: ${{ secrets.BEEMINDER_AUTH_TOKEN }}
        run: pnpm run deploy:aws
