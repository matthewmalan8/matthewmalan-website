name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Daily at 7 AM UTC = midnight Mesa, Arizona (UTC-7, no DST).
    # Rebuilds the site so scheduled episode clips auto-flip to playable
    # the morning of their release date even without a code/content push.
    - cron: "0 7 * * *"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Build + deploy to S3 + invalidate CloudFront
        env:
          HEVY_API_KEY: ${{ secrets.HEVY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          TOGGL_API_TOKEN: ${{ secrets.TOGGL_API_TOKEN }}
        run: pnpm run deploy:aws
