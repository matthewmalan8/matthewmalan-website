backend:
  name: github
  repo: matthewmalan8/matthewmalan-website
  branch: main
  base_url: https://decap-oauth.mattasu6.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "public/images/episodes"
public_folder: "/images/episodes"

site_url: https://matthewmalan.com
display_url: https://matthewmalan.com
logo_url: https://matthewmalan.com/favicon.svg

collections:
  - name: "episodes"
    label: "Episodes"
    label_singular: "Episode"
    folder: "content/episodes"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — {{date | date('YYYY-MM-DD')}}"
    sortable_fields: ["date", "title", "episodeNumber"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime" }
      - {
          label: "Episode Number",
          name: "episodeNumber",
          widget: "number",
          value_type: "int",
          required: false,
          default: 30, # AUTO-EPISODE-NUMBER
        }
      - {
          label: "Featured (pin to top of archive)",
          name: "featured",
          widget: "boolean",
          default: false,
          required: false,
        }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Image Alt Text", name: "imageAlt", widget: "string" }
      - {
          label: "Excerpt",
          name: "excerpt",
          widget: "text",
          hint: "One-sentence summary shown on the archive listing and meta description.",
        }
      - label: "Topics"
        name: "topics"
        widget: "select"
        multiple: true
        min: 1
        hint: "Pick all that apply. Drives the filter chips on /podcast/ and the 'You may also like' suggestions."
        options:
          - "Leadership"
          - "Mindset"
          - "Decision-Making"
          - "Strategy"
          - "Team Building"
          - "Culture"
          - "Hiring & Talent"
          - "Communication"
          - "Public Speaking"
          - "Storytelling"
          - "Negotiation"
          - "Entrepreneurship"
          - "Sales"
          - "Marketing"
          - "Money"
          - "Investing"
          - "Supply Chain"
          - "Productivity"
          - "Habits"
          - "Focus & Attention"
          - "Time Management"
          - "Resilience"
          - "Wellness"
          - "Career Growth"
          - "Creativity"
          - "Authenticity"
          - "Faith"
          - "AI"
          - "Technology"
      - { label: "Guest Name", name: "guest", widget: "string", required: false }
      - {
          label: "Guest Bio",
          name: "guestBio",
          widget: "text",
          required: false,
        }
      - {
          label: "Guest Image",
          name: "guestImage",
          widget: "image",
          required: false,
        }
      - label: "Guest Socials"
        name: "guestSocials"
        widget: "object"
        required: false
        collapsed: true
        fields:
          - {
              label: "Twitter / X URL",
              name: "twitter",
              widget: "string",
              required: false,
            }
          - {
              label: "Instagram URL",
              name: "instagram",
              widget: "string",
              required: false,
            }
          - {
              label: "LinkedIn URL",
              name: "linkedin",
              widget: "string",
              required: false,
            }
          - {
              label: "Facebook URL",
              name: "facebook",
              widget: "string",
              required: false,
            }
          - {
              label: "Website URL",
              name: "website",
              widget: "string",
              required: false,
            }
      - {
          label: "YouTube URL",
          name: "youtube",
          widget: "string",
          required: false,
          hint: "Full YouTube URL — embed renders automatically.",
        }
      - {
          label: "Spotify URL",
          name: "spotify",
          widget: "string",
          required: false,
        }
      - {
          label: "Apple Podcasts URL",
          name: "applePodcasts",
          widget: "string",
          required: false,
        }
      - label: "Clips from this episode"
        name: "clips"
        widget: "list"
        required: false
        collapsed: true
        label_singular: "Clip"
        summary: "{{title}}"
        hint: "Short YouTube clips that play inline on the episode page. Set a scheduled date if the clip isn't released yet."
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - {
              label: "YouTube URL",
              name: "videoUrl",
              widget: "string",
              required: false,
              hint: "Full YouTube URL (regular video, Shorts, or youtu.be link). Leave blank if you haven't recorded/uploaded it yet.",
            }
          - {
              label: "Scheduled Release Date",
              name: "scheduledFor",
              widget: "datetime",
              date_format: "YYYY-MM-DD",
              time_format: false,
              required: false,
              hint: "Optional — if set and still in the future at build time, the clip shows as 'Dropping <date>' instead of playable. Becomes playable automatically on the next rebuild after this date.",
            }
      - label: "Guest's Book / Special Offer (optional)"
        name: "book"
        widget: "object"
        required: false
        collapsed: true
        hint: "Highlighted yellow card on the episode page. Switch Mode to 'Special Offer' when the guest is giving away a promo code instead of a book."
        fields:
          - {
              label: "Mode",
              name: "mode",
              widget: "select",
              options: ["book", "offer"],
              default: "book",
              hint: "book = full Featured Book card (title / cover / description / affiliate link). offer = Special Offer card that shows ONLY the Description field (put the promo code + offer text there).",
            }
          - {
              label: "Book Title",
              name: "title",
              widget: "string",
              required: false,
              hint: "Ignored in Special Offer mode.",
            }
          - {
              label: "Book Cover Image",
              name: "image",
              widget: "image",
              required: false,
              hint: "Ignored in Special Offer mode.",
            }
          - {
              label: "Description",
              name: "description",
              widget: "text",
              required: false,
              hint: "In book mode: a few sentences about the book. In Special Offer mode: the ONLY field shown — put the promo code + offer copy here (line breaks preserved).",
            }
          - {
              label: "Link (Amazon, publisher, etc.)",
              name: "link",
              widget: "string",
              required: false,
              hint: "Ignored in Special Offer mode.",
            }
      - {
          label: "Show Notes",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Timestamps, links, summary — markdown supported.",
        }
