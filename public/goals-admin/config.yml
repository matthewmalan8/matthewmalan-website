          name: "beeminderSlug",
          widget: "string",
          required: false,
          hint: "Slug of the Beeminder goal that mirrors this one. Daily sync pushes the current value as a datapoint. Tip: set the Beeminder goal's deadline to ONE DAY AFTER this goal's deadline so the 6 AM website rebuild has time to sync before Beeminder enforces.",
        }
      - { label: "Last updated", name: "lastUpdated", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

