        }
      - {
          label: "Is pledge",
          name: "isPledge",
          widget: "boolean",
          required: false,
          default: false,
          hint: "Turn on to track this goal as a pledge — money you owe (and to whom) if you fail.",
        }
      - { label: "Pledge amount ($)", name: "pledgeAmount", widget: "number", value_type: "float", required: false, default: 0 }
      - { label: "Pledge recipient", name: "pledgeRecipient", widget: "string", required: false }
      - {
          label: "Pledge challenge video URL",
          name: "pledgeVideoUrl",
          widget: "string",
          required: false,
          hint: "Optional — TikTok / YouTube URL of you announcing the challenge.",
        }
      - {
          label: "Pledge proof image",
          name: "pledgeProofImage",
          widget: "image",
