      - { label: "Pinned", name: "pinned", widget: "boolean", required: false, default: false }
      - { label: "Share to page", name: "shareTo", widget: "hidden", default: "none" }
      - { label: "Is pledge", name: "isPledge", widget: "hidden", default: false }
      - { label: "Pledge amount", name: "pledgeAmount", widget: "hidden", default: 0 }
      - { label: "Pledge recipient", name: "pledgeRecipient", widget: "hidden", default: "" }
      - { label: "Pledge video URL", name: "pledgeVideoUrl", widget: "hidden", default: "" }
      - { label: "Pledge proof image", name: "pledgeProofImage", widget: "hidden", default: "" }
      - {
