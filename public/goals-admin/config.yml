backend:
  name: github
  repo: matthewmalan8/matthewmalan-website
  branch: main
  base_url: https://decap-oauth.mattasu6.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "public/images/goals"
public_folder: "/images/goals"

site_url: https://matthewmalan.com
display_url: https://matthewmalan.com/goals/
logo_url: https://matthewmalan.com/favicon.svg

# Shared field templates ----------------------------------------------------
# Decap doesn't support YAML anchors well in production, so the common
# fields are duplicated across the 4 category collections. Keep them in
# sync by hand.

collections:
  # ---- Family -----------------------------------------------------------
  - name: "family"
    label: "Family Goals"
    label_singular: "Family Goal"
    folder: "content/goals/family"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{timeframe | upper}} · {{title}} ({{status}})"
    sortable_fields: ["deadline", "title", "status"]
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - {
          label: "Category",
          name: "category",
          widget: "hidden",
          default: "Family",
        }
      - {
          label: "Timeframe",
          name: "timeframe",
          widget: "select",
          required: false,
          options: ["week", "quarter", "year", "custom"],
          default: "week",
          hint: "Current week: Week 20 of 2026 (May 17–May 23 · 2026-05-17 → 2026-05-23). Current quarter: Q2 2026 (Apr 1–Jun 30 · 2026-04-01 → 2026-06-30). Current year: Year 2026 (2026-01-01 → 2026-12-31).", # AUTO-TIMEFRAME-HINT
        }
      - {
          label: "Group key (optional)",
          name: "group",
          widget: "string",
          required: false,
          hint: "Goals in the same category + timeframe + group key are surfaced together as one rolled-up KPI on /goals/. Leave blank for standalone goals.",
        }
      - {
          label: "Target",
          name: "target",
          widget: "number",
          value_type: "float",
          required: false,
          default: 1,
        }
      - {
          label: "Current",
          name: "current",
          widget: "number",
          value_type: "float",
          required: false,
          default: 0,
        }
      - {
          label: "Unit",
          name: "unit",
          widget: "string",
          required: false,
          hint: "e.g. visits, times, sessions",
        }
      - {
          label: "Start date",
          name: "startDate",
          widget: "datetime",
          required: false,
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
          hint: "For weekly goals, use the Sunday that starts the week.",
        }
      - {
          label: "Deadline",
          name: "deadline",
          widget: "datetime",
          required: false,
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
          hint: "Weeks: that Saturday. Quarters: last day of the quarter. Year: Dec 31.",
        }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          required: false,
          options: ["active", "successful", "failed", "archived"],
          default: "active",
          hint: "Use 'archived' to hide a goal from the active board while keeping the file.",
        }
      - {
          label: "Pinned",
          name: "pinned",
          widget: "boolean",
          required: false,
          default: false,
          hint: "Family goals are never shared to /dropshipping/ or /gym/. Pin is a no-op here but kept for schema parity.",
        }
      - {
          label: "Share to page",
          name: "shareTo",
          widget: "hidden",
          default: "none",
        }
      - {
          label: "Is pledge",
          name: "isPledge",
          widget: "hidden",
          default: false,
        }
      - { label: "Pledge amount", name: "pledgeAmount", widget: "hidden", default: 0 }
      - { label: "Pledge recipient", name: "pledgeRecipient", widget: "hidden", default: "" }
      - { label: "Pledge video URL", name: "pledgeVideoUrl", widget: "hidden", default: "" }
      - { label: "Pledge proof image", name: "pledgeProofImage", widget: "hidden", default: "" }
      - {
          label: "Linked metric (optional)",
          name: "metricSlug",
          widget: "relation",
          collection: "metrics",
          search_fields: ["name"],
          value_field: "{{slug}}",
          display_fields: ["name"],
          required: false,
          hint: "Link to a metric to auto-compute progress from logged entries. Leave blank to enter Current manually.",
        }
      - {
          label: "Beeminder slug (optional)",
          name: "beeminderSlug",
          widget: "string",
          required: false,
          hint: "Slug of the Beeminder goal that mirrors this one. Daily sync pushes the current value as a datapoint. Tip: set the Beeminder goal's deadline to ONE DAY AFTER this goal's deadline so the 6 AM website rebuild has time to sync before Beeminder enforces.",
        }
      - {
          label: "Last updated",
          name: "lastUpdated",
          widget: "datetime",
          required: false,
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
        }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

