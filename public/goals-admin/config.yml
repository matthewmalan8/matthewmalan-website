          name: "status",
          widget: "select",
          required: false,
          options: ["active", "successful", "failed", "archived"],
          default: "active",
        }
      - {
          label: "Pin to top",
          name: "pinned",
          widget: "boolean",
          required: false,
          default: false,
          hint: "Pinned goal is the big featured card at the top of /goals/ (and /dropshipping/ if shared).",
        }
      - {
          label: "Share to page",
          name: "shareTo",
          widget: "select",
          required: false,
          options: ["none", "dropshipping"],
          default: "none",
