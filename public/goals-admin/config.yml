          required: false,
          hint: "Slug of the Beeminder goal that mirrors this one. Daily sync pushes the current value as a datapoint. Tip: set the Beeminder goal's deadline to ONE DAY AFTER this goal's deadline so the 6 AM website rebuild has time to sync before Beeminder enforces.",
        }
      - { label: "Last updated", name: "lastUpdated", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  # ---- Metrics (definitions) --------------------------------------------
  # A metric is anything you want to count over time — sales, gym visits,
  # church attendance, sign-ups, hours, podcast uploads, anything. You
  # define one here, then link goals to it on the goal form and log
  # entries in the "Metric Entries" collection.
  - name: "metrics"
    label: "Metrics"
    label_singular: "Metric"
    folder: "content/goals/metrics"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{name}} ({{unit}})"
    fields:
      - {
          label: "Name",
          name: "name",
          widget: "string",
          hint: "Whatever you want to call it — 'Gym visits', 'Sales made', 'Church attendance', etc.",
        }
      - {
          label: "Unit",
          name: "unit",
          widget: "string",
          required: false,
          hint: "Optional — display label like 'visits', 'sales', '$', 'hours'.",
        }
      - {
          label: "Notes",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Anything that helps you remember what counts toward this metric.",
        }

  # ---- Metric Entries (data points) ------------------------------------
  # Log a single occurrence here. Pick the metric and the value (e.g.
  # 1 gym visit, 250 in sales). Every active goal linked to the same
  # metric whose date range includes this entry auto-updates its
  # progress on the next site build.
  - name: "metric-entries"
    label: "Metric Entries"
    label_singular: "Entry"
    folder: "content/goals/metric-entries"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{metric}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{date}} · {{metric}} +{{value}}"
    sortable_fields: ["date", "metric"]
    fields:
      - {
          label: "Metric",
          name: "metric",
          widget: "relation",
          collection: "metrics",
          search_fields: ["name"],
          value_field: "{{slug}}",
          display_fields: ["name"],
          hint: "Which metric does this entry count toward?",
        }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
        }
      - {
          label: "Value",
          name: "value",
          widget: "number",
          value_type: "float",
          default: 1,
          hint: "Amount to add. Use 1 for a single occurrence (gym visit, podcast upload), or a number for measurable metrics ($250 in sales).",
        }
      - {
          label: "Note",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Optional — context for this entry.",
        }
