backend:
  name: github
  repo: matthewmalan8/matthewmalan-website
  branch: main
  base_url: https://decap-oauth.mattasu6.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "public/images/goals"
public_folder: "/images/goals"

site_url: https://matthewmalan.com
display_url: https://matthewmalan.com/goals/
logo_url: https://matthewmalan.com/favicon.svg

# Honor-system goals: when a pledged goal isn't met by 23:45 MST on its
# deadline day, the website marks it failed and you self-pay. Recipient
# is either "charity" (private) or "tiktok" (always when shareTo:
# dropshipping). For tiktok recipients, log a Pledge Proof afterward
# with the recipient's profile + payment screenshot.

collections:
  # ---------------------------------------------------------------------
  # Goal collections (Family / Fundamentals / Finance / Fitness)
  # ---------------------------------------------------------------------
  - name: "family"
    label: "Family Goals"
    label_singular: "Family Goal"
    folder: "content/goals/family"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{timeframe | upper}} · {{title}} ({{status}})"
    sortable_fields: ["deadline", "title", "status"]
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - {
          label: "Sub-description (shown behind the i info icon)",
          name: "subDescription",
          widget: "text",
          required: false,
          hint: "Optional. Long-form context. Renders behind an (i) icon on the card — click/hover opens a popup.",
        }
      - { label: "Category", name: "category", widget: "hidden", default: "Family" }
      - {
          label: "Timeframe",
          name: "timeframe",
          widget: "select",
          required: false,
          options: ["daily", "week", "quarter", "year", "custom"],
          default: "daily",
        }
      - { label: "Group key (optional)", name: "group", widget: "string", required: false }
      - { label: "Target", name: "target", widget: "number", value_type: "float", required: false, default: 1 }
      - { label: "Current", name: "current", widget: "number", value_type: "float", required: false, default: 0 }
      - { label: "Unit", name: "unit", widget: "string", required: false }
      - { label: "Start date", name: "startDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Deadline (one-shot only)", name: "deadline", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false, hint: "Leave blank for daily-recurring goals." }
      - {
          label: "Status",
          name: "status",
          widget: "select",
          required: false,
          options: ["active", "successful", "failed", "archived"],
          default: "active",
        }
      - { label: "Pinned", name: "pinned", widget: "boolean", required: false, default: false }
      - { label: "Share to page", name: "shareTo", widget: "hidden", default: "none" }
      - {
          label: "Pledge amount ($)",
          name: "pledgeAmount",
          widget: "number",
          value_type: "float",
          required: false,
          default: 0,
          min: 0,
          hint: "0 = no pledge. Above 0 makes this an honor-system pledge goal — money owed (to charity OR a random TikToker) if you fail.",
        }
      - {
          label: "Pledge recipient",
          name: "pledgeRecipient",
          widget: "select",
          required: false,
          options: ["charity", "tiktok"],
          default: "charity",
          hint: "Forced to 'tiktok' when shareTo == dropshipping.",
        }
      - {
          label: "Daily source",
          name: "dailySource",
          widget: "select",
          required: false,
          options: ["counter", "tasks"],
          default: "counter",
          hint: "counter = sum Counter Logs for the day. tasks = require all Google Tasks completed.",
        }
      - {
          label: "Counter slug",
          name: "counterSlug",
          widget: "string",
          required: false,
          hint: "When dailySource=counter, ticks logged in Counter Logs with this slug add up toward the goal.",
        }
      - {
          label: "Linked metric (optional)",
          name: "metricSlug",
          widget: "relation",
          collection: "metrics",
          search_fields: ["name"],
          value_field: "{{slug}}",
          display_fields: ["name"],
          required: false,
        }
      - { label: "Last updated", name: "lastUpdated", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  - name: "fundamentals"
    label: "Fundamentals Goals"
    label_singular: "Fundamentals Goal"
    folder: "content/goals/fundamentals"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{timeframe | upper}} · {{title}} ({{status}})"
    sortable_fields: ["deadline", "title", "status"]
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Sub-description (info popup)", name: "subDescription", widget: "text", required: false }
      - { label: "Category", name: "category", widget: "hidden", default: "Fundamentals" }
      - { label: "Timeframe", name: "timeframe", widget: "select", required: false, options: ["daily", "week", "quarter", "year", "custom"], default: "daily" }
      - { label: "Group key (optional)", name: "group", widget: "string", required: false }
      - { label: "Target", name: "target", widget: "number", value_type: "float", required: false, default: 1 }
      - { label: "Current", name: "current", widget: "number", value_type: "float", required: false, default: 0 }
      - { label: "Unit", name: "unit", widget: "string", required: false }
      - { label: "Start date", name: "startDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Deadline (one-shot only)", name: "deadline", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Status", name: "status", widget: "select", required: false, options: ["active", "successful", "failed", "archived"], default: "active" }
      - { label: "Pinned", name: "pinned", widget: "boolean", required: false, default: false }
      - { label: "Share to page", name: "shareTo", widget: "hidden", default: "none" }
      - { label: "Pledge amount ($)", name: "pledgeAmount", widget: "number", value_type: "float", required: false, default: 0, min: 0 }
      - { label: "Pledge recipient", name: "pledgeRecipient", widget: "select", required: false, options: ["charity", "tiktok"], default: "charity" }
      - { label: "Daily source", name: "dailySource", widget: "select", required: false, options: ["counter", "tasks"], default: "counter" }
      - { label: "Counter slug", name: "counterSlug", widget: "string", required: false }
      - { label: "Linked metric (optional)", name: "metricSlug", widget: "relation", collection: "metrics", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"], required: false }
      - { label: "Last updated", name: "lastUpdated", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  - name: "finance"
    label: "Finance Goals"
    label_singular: "Finance Goal"
    folder: "content/goals/finance"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{timeframe | upper}} · {{title}} ({{status}})"
    sortable_fields: ["deadline", "title", "status"]
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Sub-description (info popup)", name: "subDescription", widget: "text", required: false }
      - { label: "Category", name: "category", widget: "hidden", default: "Finance" }
      - { label: "Timeframe", name: "timeframe", widget: "select", required: false, options: ["daily", "week", "quarter", "year", "custom"], default: "daily" }
      - { label: "Group key (optional)", name: "group", widget: "string", required: false }
      - { label: "Target", name: "target", widget: "number", value_type: "float", required: false, default: 1 }
      - { label: "Current", name: "current", widget: "number", value_type: "float", required: false, default: 0 }
      - { label: "Unit", name: "unit", widget: "string", required: false }
      - { label: "Start date", name: "startDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Deadline (one-shot only)", name: "deadline", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Status", name: "status", widget: "select", required: false, options: ["active", "successful", "failed", "archived"], default: "active" }
      - { label: "Pin to top", name: "pinned", widget: "boolean", required: false, default: false }
      - {
          label: "Share to page",
          name: "shareTo",
          widget: "select",
          required: false,
          options: ["none", "dropshipping"],
          default: "none",
          hint: "Pick 'dropshipping' to surface this goal on /dropshipping/. For pledge goals, this also forces pledgeRecipient to 'tiktok'.",
        }
      - { label: "Pledge amount ($)", name: "pledgeAmount", widget: "number", value_type: "float", required: false, default: 0, min: 0 }
      - { label: "Pledge recipient", name: "pledgeRecipient", widget: "select", required: false, options: ["charity", "tiktok"], default: "charity" }
      - { label: "Daily source", name: "dailySource", widget: "select", required: false, options: ["counter", "tasks"], default: "counter" }
      - { label: "Counter slug", name: "counterSlug", widget: "string", required: false }
      - { label: "Linked metric (optional)", name: "metricSlug", widget: "relation", collection: "metrics", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"], required: false }
      - { label: "Last updated", name: "lastUpdated", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  - name: "fitness"
    label: "Fitness Goals"
    label_singular: "Fitness Goal"
    folder: "content/goals/fitness"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{timeframe | upper}} · {{title}} ({{status}})"
    sortable_fields: ["deadline", "title", "status"]
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Sub-description (info popup)", name: "subDescription", widget: "text", required: false }
      - { label: "Category", name: "category", widget: "hidden", default: "Fitness" }
      - { label: "Timeframe", name: "timeframe", widget: "select", required: false, options: ["daily", "week", "quarter", "year", "custom"], default: "daily" }
      - { label: "Group key (optional)", name: "group", widget: "string", required: false }
      - { label: "Target", name: "target", widget: "number", value_type: "float", required: false, default: 1 }
      - { label: "Current", name: "current", widget: "number", value_type: "float", required: false, default: 0 }
      - { label: "Unit", name: "unit", widget: "string", required: false }
      - { label: "Start date", name: "startDate", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Deadline (one-shot only)", name: "deadline", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Status", name: "status", widget: "select", required: false, options: ["active", "successful", "failed", "archived"], default: "active" }
      - { label: "Pin to top", name: "pinned", widget: "boolean", required: false, default: false }
      - { label: "Share to page", name: "shareTo", widget: "select", required: false, options: ["none", "gym"], default: "none" }
      - { label: "Pledge amount ($)", name: "pledgeAmount", widget: "number", value_type: "float", required: false, default: 0, min: 0 }
      - { label: "Pledge recipient", name: "pledgeRecipient", widget: "select", required: false, options: ["charity", "tiktok"], default: "charity" }
      - { label: "Daily source", name: "dailySource", widget: "select", required: false, options: ["counter", "tasks"], default: "counter" }
      - { label: "Counter slug", name: "counterSlug", widget: "string", required: false }
      - { label: "Linked metric (optional)", name: "metricSlug", widget: "relation", collection: "metrics", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"], required: false }
      - { label: "Last updated", name: "lastUpdated", widget: "datetime", required: false, date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  # ---------------------------------------------------------------------
  # Counter Logs — each "tick" toward a counter-based pledge goal.
  # ---------------------------------------------------------------------
  - name: "counter-logs"
    label: "Counter Logs"
    label_singular: "Counter Log"
    folder: "content/goals/counter-logs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{counter}}-{{hour}}{{minute}}{{second}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{date}} · {{counter}} +{{value}}"
    sortable_fields: ["date", "counter"]
    fields:
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
        }
      - {
          label: "Counter slug",
          name: "counter",
          widget: "string",
          hint: "Must match a goal's `counterSlug` field exactly. e.g. dropshipping-hours, contact-dad, phone-productive.",
        }
      - {
          label: "Value",
          name: "value",
          widget: "number",
          value_type: "float",
          default: 1,
          hint: "Usually 1 — one tap = one tick. For multi-unit counters (rare) you can enter higher numbers.",
        }
      - {
          label: "Note",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Optional context.",
        }

  # ---------------------------------------------------------------------
  # Pledge Proofs — only used when a shared-to-dropshipping pledge fails.
  # Records the TikTok recipient + payment screenshot.
  # ---------------------------------------------------------------------
  - name: "pledge-proofs"
    label: "Pledge Proofs"
    label_singular: "Pledge Proof"
    folder: "content/goals/pledge-proofs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{goalSlug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{date}} · {{goalSlug}} → @{{tiktokUsername}}"
    sortable_fields: ["date", "goalSlug"]
    fields:
      - { label: "Date (day the goal failed)", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - {
          label: "Goal slug",
          name: "goalSlug",
          widget: "string",
          hint: "Must match the failed goal's slug exactly (the markdown filename without .md).",
        }
      - {
          label: "TikTok username (no @)",
          name: "tiktokUsername",
          widget: "string",
        }
      - {
          label: "TikTok profile avatar URL",
          name: "tiktokAvatar",
          widget: "string",
          required: false,
          hint: "Optional — paste the URL of the recipient's TikTok profile picture.",
        }
      - {
          label: "TikTok profile URL",
          name: "tiktokProfileUrl",
          widget: "string",
          required: false,
          hint: "Optional — link to the recipient's profile (https://www.tiktok.com/@username).",
        }
      - {
          label: "Payment screenshot",
          name: "screenshot",
          widget: "image",
          required: false,
          hint: "Upload proof of payment (Venmo / Cash App / PayPal receipt).",
        }
      - {
          label: "Note",
          name: "body",
          widget: "markdown",
          required: false,
        }

  # ---------------------------------------------------------------------
  # Metrics + Metric Entries (existing — used for non-pledge progress)
  # ---------------------------------------------------------------------
  - name: "metrics"
    label: "Metrics"
    label_singular: "Metric"
    folder: "content/goals/metrics"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{name}} ({{unit}})"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - { label: "Unit", name: "unit", widget: "string", required: false }
      - { label: "Notes", name: "body", widget: "markdown", required: false }

  - name: "metric-entries"
    label: "Metric Entries"
    label_singular: "Entry"
    folder: "content/goals/metric-entries"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{metric}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{date}} · {{metric}} +{{value}}"
    sortable_fields: ["date", "metric"]
    fields:
      - { label: "Metric", name: "metric", widget: "relation", collection: "metrics", search_fields: ["name"], value_field: "{{slug}}", display_fields: ["name"] }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, picker_utc: false }
      - { label: "Value", name: "value", widget: "number", value_type: "float", default: 1 }
      - { label: "Note", name: "body", widget: "markdown", required: false }
