backend:
  name: github
  repo: matthewmalan8/matthewmalan-website
  branch: main
  base_url: https://decap-oauth.mattasu6.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "public/images/books"
public_folder: "/images/books"

site_url: https://matthewmalan.com
display_url: https://matthewmalan.com/books/
logo_url: https://matthewmalan.com/favicon.svg

collections:
  - name: "books"
    label: "Book Reviews"
    label_singular: "Book Review"
    folder: "content/books"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}} — by {{author}}"
    sortable_fields: ["readOn", "rating", "title", "author"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Cover Image", name: "coverImage", widget: "image" }
      - {
          label: "Cover Image Alt Text",
          name: "coverImageAlt",
          widget: "string",
          required: false,
          hint: "Description of the cover for screen readers.",
        }
      - {
          label: "Rating (1–5)",
          name: "rating",
          widget: "number",
          value_type: "int",
          min: 1,
          max: 5,
          hint: "How many stars out of 5.",
        }
      - {
          label: "Amazon Link",
          name: "amazonLink",
          widget: "string",
          required: false,
          hint: "Full Amazon URL — the 'Get the book' button at the bottom of the review.",
        }
      - label: "Tags"
        name: "tags"
        widget: "select"
        multiple: true
        required: false
        hint: "Used to recommend similar books. Same vocabulary as podcast topics."
        options:
          - "Leadership"
          - "Mindset"
          - "Decision-Making"
          - "Strategy"
          - "Team Building"
          - "Culture"
          - "Hiring & Talent"
          - "Communication"
          - "Public Speaking"
          - "Storytelling"
          - "Negotiation"
          - "Entrepreneurship"
          - "Sales"
          - "Marketing"
          - "Money"
          - "Investing"
          - "Supply Chain"
          - "Productivity"
          - "Habits"
          - "Focus & Attention"
          - "Time Management"
          - "Resilience"
          - "Wellness"
          - "Career Growth"
          - "Creativity"
          - "Authenticity"
          - "Faith"
          - "Biography"
          - "Memoir"
          - "Fiction"
          - "History"
          - "Philosophy"
      - label: "Readings"
        name: "readings"
        widget: "list"
        required: false
        collapsed: false
        min: 1
        hint: "Add an entry each time you read the book — date plus your notes for that reading. Multiple readings appear as tabs on the book's page."
        label_singular: "Reading"
        summary: "{{fields.date | date('YYYY-MM-DD')}}"
        fields:
          - {
              label: "Date Read",
              name: "date",
              widget: "datetime",
              date_format: "YYYY-MM-DD",
              time_format: false,
              picker_utc: false,
              hint: "When you finished this reading.",
            }
          - {
              label: "YouTube Video URL",
              name: "videoUrl",
              widget: "string",
              required: false,
              hint: "Optional — if you reviewed this reading on video, paste the YouTube URL. The video appears above your notes on the book page.",
            }
          - {
              label: "Notes",
              name: "notes",
              widget: "markdown",
              required: false,
              hint: "Your thoughts on this reading — markdown supported.",
            }
