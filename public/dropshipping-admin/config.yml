backend:
  name: github
  repo: matthewmalan8/matthewmalan-website
  branch: main
  base_url: https://decap-oauth.mattasu6.workers.dev
  auth_endpoint: auth

publish_mode: simple

media_folder: "public/images/dropshipping"
public_folder: "/images/dropshipping"

site_url: https://matthewmalan.com
display_url: https://matthewmalan.com/dropshipping/
logo_url: https://matthewmalan.com/favicon.svg

collections:
  - name: "daily"
    label: "Daily Logs"
    label_singular: "Daily Log"
    folder: "content/dropshipping/daily"
    create: true
    slug: "{{year}}-{{month}}-{{day}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{date}} · {{hoursWorked}}h"
    sortable_fields: ["date", "hoursWorked"]
    fields:
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
          picker_utc: false,
        }
      - {
          label: "Hours Worked",
          name: "hoursWorked",
          widget: "number",
          value_type: "int",
          min: 0,
          default: 0,
        }
      - {
          label: "Minutes Worked",
          name: "minutesWorked",
          widget: "number",
          value_type: "int",
          min: 0,
          max: 59,
          required: false,
          hint: "Optional — additional minutes on top of the hours (0–59).",
        }
      - {
          label: "Video URL",
          name: "videoUrl",
          widget: "string",
          required: false,
          hint: "TikTok / YouTube / Instagram link to that day's video. Leave blank if no video was posted.",
        }
      - {
          label: "Notes",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Optional — what happened today.",
        }

  - name: "screenshots"
    label: "Screenshots"
    label_singular: "Screenshot"
    folder: "content/dropshipping/screenshots"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{date}} · {{caption}}"
    sortable_fields: ["date"]
    fields:
      - { label: "Image", name: "image", widget: "image" }
      - {
          label: "Image Alt Text",
          name: "imageAlt",
          widget: "string",
          required: false,
        }
      - {
          label: "Date",
          name: "date",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          label: "Caption",
          name: "caption",
          widget: "text",
          required: false,
          hint: "Short note about what the screenshot shows.",
        }

  - name: "failures"
    label: "Failure Graveyard"
    label_singular: "Failure"
    folder: "content/dropshipping/failures"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{product}} — {{failedOn}}"
    sortable_fields: ["failedOn", "adSpend"]
    fields:
      - { label: "Product Name", name: "product", widget: "string" }
      - {
          label: "Product Image",
          name: "productImage",
          widget: "image",
          required: false,
        }
      - {
          label: "Hide product (blur image + name)",
          name: "blur",
          widget: "boolean",
          default: false,
          hint: "If on, the product name and image are blurred on the page so people can't see your strategy.",
        }
      - {
          label: "Failed On (date)",
          name: "failedOn",
          widget: "datetime",
          date_format: "YYYY-MM-DD",
          time_format: false,
        }
      - {
          label: "Ad Spend (USD)",
          name: "adSpend",
          widget: "number",
          value_type: "float",
          default: 0,
        }
      - {
          label: "Why I thought it would work",
          name: "hypothesis",
          widget: "text",
          required: false,
        }
      - {
          label: "Why it failed",
          name: "reasonFailed",
          widget: "text",
          required: false,
        }
      - {
          label: "Video recap URL",
          name: "videoUrl",
          widget: "string",
          required: false,
        }
      - {
          label: "Lessons Learned",
          name: "body",
          widget: "markdown",
          required: false,
          hint: "Markdown supported — bullet points work well here.",
        }
